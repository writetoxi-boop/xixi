<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}XIXI — Asia's Culture, Commerce, Creators, Capital{{ else }}{{ .Title }} — XIXI{{ end }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/xixi.css">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZPEBTQ0HXW"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-ZPEBTQ0HXW");</script>
</head>
<body>
{{ partial "nav.html" . }}
<main>{{ block "main" . }}{{ end }}</main>
{{ partial "footer.html" . }}
<script>
if (window.netlifyIdentity) {
  window.netlifyIdentity.on("init", u => {
    if (!u) window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
  });
}
</script>
{{ partial "popup.html" . }}

<!-- EMAIL POPUP -->
<div id="xixi-popup" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(26,26,26,0.7); backdrop-filter:blur(4px); align-items:center; justify-content:center;">
  <div style="background:#FFFFFF; max-width:480px; width:90%; padding:56px 48px; position:relative;">
    <button onclick="closePopup()" style="position:absolute; top:20px; right:24px; background:none; border:none; font-size:20px; cursor:pointer; color:#9B9B9B;">&#x2715;</button>
    <div style="font-family:sans-serif; font-size:10px; font-weight:600; letter-spacing:0.25em; text-transform:uppercase; color:#D4F53C; background:#1A1A1A; display:inline-block; padding:4px 12px; margin-bottom:20px;">The Asia Letter</div>
    <h2 style="font-family:Georgia,serif; font-size:32px; font-weight:400; font-style:italic; line-height:1.2; margin-bottom:12px;">Stay ahead of Asia.</h2>
    <p style="font-family:Georgia,serif; font-size:16px; font-weight:300; color:#555; line-height:1.7; margin-bottom:28px;">One weekly read. The trends, deals, and cultural shifts shaping Asia — before everyone else catches on.</p>
    <div style="display:flex;">
      <input id="popup-email" type="email" placeholder="Your email address" style="flex:1; border:1px solid #E8E4DC; border-right:none; padding:13px 16px; font-family:sans-serif; font-size:13px; outline:none;" />
      <button onclick="submitPopup()" style="background:#1A1A1A; color:#FFFFFF; border:none; padding:13px 22px; font-family:sans-serif; font-size:10px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; cursor:pointer;">Subscribe</button>
    </div>
    <p id="popup-msg" style="font-size:12px; color:#9B9B9B; display:none; margin-top:8px;"></p>
    <p style="font-size:11px; color:#9B9B9B; margin-top:12px;">No spam. Unsubscribe anytime.</p>
  </div>
</div>
<script>
setTimeout(function() {
  var p = document.getElementById('xixi-popup');
  if (p) p.style.display = 'flex';
}, 40000);

function closePopup() {
  document.getElementById('xixi-popup').style.display = 'none';
  var d = new Date();
  d.setTime(d.getTime() + (30*24*60*60*1000));
  document.cookie = 'xixi_seen=1; expires=' + d.toUTCString() + '; path=/';
}

function submitPopup() {
  var email = document.getElementById('popup-email').value;
  var msg = document.getElementById('popup-msg');
  if (!email || !email.includes('@')) {
    msg.style.display = 'block';
    msg.style.color = '#e74c3c';
    msg.textContent = 'Please enter a valid email.';
    return;
  }
  window.open('https://xixithemagazine.beehiiv.com/subscribe?email=' + encodeURIComponent(email), '_blank');
  msg.style.display = 'block';
  msg.style.color = '#27ae60';
  msg.textContent = "You are in! Check your inbox.";
  setTimeout(closePopup, 2000);
}

document.getElementById('xixi-popup').addEventListener('click', function(e) {
  if (e.target === this) closePopup();
});
</script>

</body>
</html>
