<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Params.dek }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F5F0E8;
      --ink: #1C1C1A;
      --rust: #C13B2A;
      --ink-soft: rgba(28, 28, 26, 0.62);
      --ink-faint: rgba(28, 28, 26, 0.28);
      --ink-hairline: rgba(28, 28, 26, 0.18);
    }

    html, body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'Cormorant Garamond', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body { min-height: 100vh; position: relative; padding-bottom: 0; }

    .frame {
      position: fixed; top: 24px; right: 24px; bottom: 24px; left: 24px;
      border: 0.5px solid var(--ink-hairline);
      pointer-events: none; z-index: 1;
    }

    .masthead {
      position: relative; z-index: 2;
      display: flex; justify-content: space-between; align-items: center;
      padding: 32px 56px 24px; margin: 0 32px;
      border-bottom: 0.5px solid var(--ink-hairline);
    }

    .masthead-logo {
      font-family: 'Playfair Display', serif;
      font-weight: 700; font-size: 22px;
      letter-spacing: 0.08em; color: var(--ink); text-decoration: none;
    }

    .masthead-nav { display: flex; gap: 32px; align-items: center; }

    .masthead-nav a {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; font-weight: 400;
      letter-spacing: 0.32em; text-transform: uppercase;
      color: var(--ink-soft); text-decoration: none;
      transition: color 0.2s;
    }

    .masthead-nav a:hover, .masthead-nav a.current { color: var(--ink); }

    main { position: relative; z-index: 2; }

    .site-footer {
      position: relative; z-index: 2;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 48px 56px 24px; margin: 64px 32px 0;
      border-top: 0.5px solid var(--ink-hairline);
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px; font-weight: 400;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--ink-soft);
    }

    .footer-left, .footer-right { display: flex; flex-direction: column; gap: 6px; }
    .footer-right { text-align: right; }

    .container {
      max-width: 680px; margin: 0 auto; padding: 56px 32px 0;
    }

    .article-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 48px; padding-bottom: 16px;
      border-bottom: 0.5px solid var(--ink-hairline);
    }

    .meta-left, .meta-right {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px; font-weight: 400;
      letter-spacing: 0.32em; text-transform: uppercase;
      color: var(--ink-soft);
    }

    .member-badge { display: inline-flex; align-items: center; gap: 8px; color: var(--rust); }
    .member-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--rust); }

    .article-kicker {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; font-weight: 400;
      letter-spacing: 0.42em; text-transform: uppercase;
      color: var(--rust); margin-bottom: 24px;
      animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .article-headline {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: clamp(34px, 4.5vw, 52px);
      line-height: 1.1; letter-spacing: -0.005em;
      color: var(--ink); margin-bottom: 28px;
      animation: fadeUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }

    .article-dek {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400; font-style: italic;
      font-size: clamp(20px, 2.4vw, 24px); line-height: 1.45;
      color: var(--ink); margin-bottom: 40px; max-width: 580px;
      animation: fadeUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .article-byline {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 56px; padding-bottom: 32px;
      border-bottom: 0.5px solid var(--ink-hairline);
      animation: fadeUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }

    .byline-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px; font-weight: 400;
      letter-spacing: 0.32em; text-transform: uppercase;
      color: var(--ink-soft);
    }

    .byline-name {
      font-family: 'Playfair Display', serif;
      font-style: italic; font-size: 15px;
      font-weight: 400; color: var(--ink);
    }

    .byline-divider { width: 1px; height: 16px; background: var(--ink-faint); }

    .article-body {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400; font-size: 19px;
      line-height: 1.7; color: var(--ink);
      animation: fadeUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }

    .article-body p { margin-bottom: 24px; }

    .article-body p:first-of-type::first-letter {
      font-family: 'Playfair Display', serif;
      font-weight: 700; font-size: 68px; line-height: 0.85;
      float: left; margin: 6px 12px 0 0; color: var(--rust);
    }

    .article-body h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 500; font-size: 28px;
      margin: 48px 0 20px; line-height: 1.2;
    }

    .article-body h3 {
      font-family: 'Playfair Display', serif;
      font-weight: 500; font-style: italic;
      font-size: 22px; margin: 32px 0 16px;
    }

    .article-body blockquote {
      margin: 48px 0; padding: 32px 0;
      border-top: 0.5px solid var(--ink-hairline);
      border-bottom: 0.5px solid var(--ink-hairline);
      text-align: center;
    }

    .article-body blockquote p {
      font-family: 'Playfair Display', serif;
      font-style: italic; font-weight: 400;
      font-size: clamp(22px, 2.6vw, 28px); line-height: 1.35;
      color: var(--ink); margin: 0;
      max-width: 540px; margin-inline: auto;
    }

    .article-body hr {
      width: 32px; height: 1px;
      background: var(--ink-faint); border: none;
      margin: 32px auto;
    }

    .article-body a {
      color: var(--ink); text-decoration: none;
      border-bottom: 1px solid var(--rust); padding-bottom: 1px;
      transition: color 0.2s;
    }

    .article-body a:hover { color: var(--rust); }

    .article-body em { font-style: italic; }
    .article-body strong { font-weight: 600; }

    .article-footer {
      margin-top: 80px; padding-top: 32px;
      border-top: 0.5px solid var(--ink-hairline);
      display: flex; justify-content: space-between; align-items: center;
    }

    .footer-tag {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px; font-weight: 400;
      letter-spacing: 0.32em; text-transform: uppercase;
      color: var(--ink-soft);
    }

    .next-article {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px; font-weight: 400;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--ink); text-decoration: none;
      transition: color 0.2s;
    }

    .next-article:hover { color: var(--rust); }

    .next-article span {
      font-style: italic; letter-spacing: 0; text-transform: none;
      font-size: 14px; color: var(--ink-soft);
      display: block; margin-top: 4px;
    }

    .archive-header {
      max-width: 680px; margin: 0 auto;
      padding: 64px 32px 0; text-align: center;
    }

    .archive-title {
      font-family: 'Playfair Display', serif;
      font-weight: 600; font-size: clamp(40px, 5vw, 56px);
      color: var(--ink); margin-bottom: 16px; letter-spacing: -0.005em;
    }

    .archive-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: clamp(17px, 2vw, 20px); color: var(--ink-soft);
      margin-bottom: 64px; max-width: 460px;
      margin-inline: auto; line-height: 1.5;
    }

    .archive-grid {
      max-width: 880px; margin: 0 auto;
      padding: 0 32px;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 48px 64px;
    }

    .archive-item {
      padding-bottom: 32px;
      border-bottom: 0.5px solid var(--ink-hairline);
      transition: opacity 0.2s;
    }

    .archive-item a {
      text-decoration: none; color: inherit; display: block;
    }

    .archive-item:hover { opacity: 0.75; }

    .archive-kicker {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px; font-weight: 400;
      letter-spacing: 0.4em; text-transform: uppercase;
      color: var(--rust); margin-bottom: 12px;
    }

    .archive-headline {
      font-family: 'Playfair Display', serif;
      font-weight: 500; font-size: 24px;
      line-height: 1.2; color: var(--ink);
      margin-bottom: 12px;
    }

    .archive-dek {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 400;
      font-size: 16px; line-height: 1.5;
      color: var(--ink-soft); margin-bottom: 16px;
    }

    .archive-meta {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px; font-weight: 400;
      letter-spacing: 0.32em; text-transform: uppercase;
      color: var(--ink-soft);
    }

    .archive-empty {
      max-width: 480px; margin: 80px auto;
      text-align: center; padding: 0 32px;
    }

    .archive-empty p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 18px;
      color: var(--ink-soft); line-height: 1.6;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 720px) {
      .frame { top: 14px; right: 14px; bottom: 14px; left: 14px; }
      .masthead { padding: 24px 24px 16px; margin: 0 16px; flex-direction: column; gap: 16px; align-items: flex-start; }
      .masthead-nav { gap: 20px; flex-wrap: wrap; }
      .container { padding: 40px 24px 0; }
      .article-meta { flex-direction: column; align-items: flex-start; gap: 8px; }
      .article-body { font-size: 18px; }
      .article-body p:first-of-type::first-letter { font-size: 54px; }
      .article-byline { flex-wrap: wrap; gap: 10px; }
      .byline-divider { display: none; }
      .site-footer { flex-direction: column; align-items: flex-start; gap: 16px; margin: 48px 16px 0; padding: 32px 24px 16px; font-size: 9px; }
      .footer-right { text-align: left; }
      .article-footer { flex-direction: column; align-items: flex-start; gap: 16px; }
      .archive-grid { grid-template-columns: 1fr; gap: 32px; }
    }
  </style>
</head>
<body>
  <div class="frame"></div>

  <header class="masthead">
    <a href="/" class="masthead-logo">XIXI</a>
    <nav class="masthead-nav">
      <a href="/articles/" {{ if or (eq .Section "articles") (eq .Kind "section") }}class="current"{{ end }}>Archive</a>
      <a href="/intelligence/">Intelligence</a>
      <a href="/members/">Members</a>
      <a href="/account/">Account</a>
    </nav>
  </header>

  {{ block "main" . }}{{ end }}

  <footer class="site-footer">
    <div class="footer-left">
      <span>Singapore</span>
      <span>XIXI Media Pte Ltd</span>
    </div>
    <div class="footer-right">
      <span>Volume I</span>
      <span>Member Archive</span>
    </div>
  </footer>

</body>
</html>
