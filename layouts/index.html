<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XIXI</title>
  <meta name="description" content="A private archive for Asian art, capital, and cultural intelligence. By application only.">
  <meta property="og:title" content="XIXI">
  <meta property="og:description" content="A private archive for Asian art, capital, and cultural intelligence.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F5F0E8;
      --ink: #1C1C1A;
      --rust: #C13B2A;
      --ink-soft: rgba(28, 28, 26, 0.62);
      --ink-faint: rgba(28, 28, 26, 0.28);
      --ink-hairline: rgba(28, 28, 26, 0.18);
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: 'Cormorant Garamond', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .frame {
      position: fixed;
      top: 24px;
      right: 24px;
      bottom: 24px;
      left: 24px;
      border: 0.5px solid var(--ink-hairline);
      pointer-events: none;
      z-index: 1;
    }

    .container {
      flex: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 56px 48px 48px;
      position: relative;
      z-index: 2;
    }

    .top-mark {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--ink-soft);
      animation: fadeIn 1.2s ease-out;
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 640px;
      text-align: center;
    }

    .ornament {
      width: 1px;
      height: 56px;
      background: var(--ink-faint);
      margin-bottom: 40px;
      transform-origin: top;
      animation: drawLine 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .wordmark {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(72px, 12vw, 140px);
      letter-spacing: 0.06em;
      line-height: 1;
      color: var(--ink);
      margin-bottom: 32px;
      animation: fadeUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }

    .provocation {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(19px, 2.2vw, 23px);
      line-height: 1.5;
      color: var(--ink);
      max-width: 460px;
      margin-bottom: 56px;
      animation: fadeUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
    }

    .access-line {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 20px;
      animation: fadeUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) 1s both;
    }

    .cta {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 0.5px solid var(--ink);
      padding: 18px 44px;
      cursor: pointer;
      transition: letter-spacing 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s, color 0.3s;
      text-decoration: none;
      animation: fadeUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both;
    }

    .cta:hover {
      background: var(--ink);
      color: var(--cream);
      letter-spacing: 0.4em;
    }

    .member-link {
      position: absolute;
      top: 56px;
      right: 56px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink-soft);
      text-decoration: none;
      transition: color 0.2s;
      z-index: 3;
      animation: fadeIn 1.6s ease-out 1.4s both;
    }

    .member-link:hover { color: var(--ink); }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-soft);
      animation: fadeIn 1.6s ease-out 1.4s both;
    }

    .footer-left, .footer-right {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .footer-right { text-align: right; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(28, 28, 26, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
    }

    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.4s ease-out;
    }

    .modal {
      background: var(--cream);
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 56px 48px 44px;
      position: relative;
      border: 0.5px solid var(--ink-faint);
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: none;
      border: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ink-soft);
      cursor: pointer;
      transition: color 0.2s;
    }

    .modal-close:hover { color: var(--rust); }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-weight: 500;
      font-size: 28px;
      color: var(--ink);
      margin-bottom: 10px;
      letter-spacing: 0.01em;
    }

    .modal-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 15px;
      color: var(--ink-soft);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 22px; }

    .form-label {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 8px;
    }

    .form-input, .form-textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 0.5px solid var(--ink-faint);
      padding: 6px 0 10px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-weight: 400;
      color: var(--ink);
      transition: border-color 0.2s;
      outline: none;
      border-radius: 0;
    }

    .form-input::placeholder, .form-textarea::placeholder {
      color: var(--ink-faint);
      font-style: italic;
    }

    .form-input:focus, .form-textarea:focus {
      border-bottom-color: var(--ink);
    }

    .form-textarea {
      resize: vertical;
      min-height: 76px;
      font-family: 'Cormorant Garamond', serif;
    }

    .form-submit {
      width: 100%;
      background: var(--ink);
      color: var(--cream);
      border: 0.5px solid var(--ink);
      padding: 16px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.3s, letter-spacing 0.4s;
    }

    .form-submit:hover {
      background: var(--rust);
      border-color: var(--rust);
      letter-spacing: 0.42em;
    }

    .form-note {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 13px;
      color: var(--ink-soft);
      text-align: center;
      margin-top: 22px;
      line-height: 1.5;
    }

    .success-state { text-align: center; padding: 20px 0; }

    .success-ornament {
      width: 32px;
      height: 1px;
      background: var(--rust);
      margin: 0 auto 24px;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drawLine { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }

    @media (max-width: 640px) {
      .frame { top: 14px; right: 14px; bottom: 14px; left: 14px; }
      .container { padding: 40px 28px 28px; }
      .ornament { height: 40px; margin-bottom: 32px; }
      .wordmark { margin-bottom: 24px; letter-spacing: 0.04em; }
      .provocation { margin-bottom: 40px; }
      .footer { flex-direction: column; align-items: flex-start; gap: 12px; font-size: 9px; }
      .footer-right { text-align: left; }
      .modal { padding: 44px 28px 32px; }
      .modal-title { font-size: 24px; }
      .member-link { top: 32px; right: 24px; font-size: 10px; }
    }

    @media (max-height: 700px) {
      .container { padding: 32px 48px 28px; }
      .ornament { height: 40px; margin-bottom: 28px; }
      .provocation { margin-bottom: 40px; }
    }
  </style>
</head>
<body>
  <div class="frame"></div>

  <a href="/members/" class="member-link">Members</a>

  <div class="container">
    <div class="top-mark">· · ·</div>

    <div class="center">
      <div class="ornament"></div>
      <h1 class="wordmark">XIXI</h1>
      <p class="provocation">A private archive for Asian art, capital, and cultural intelligence.</p>
      <div class="access-line">By application</div>
      <a href="#" class="cta" onclick="openModal(event)">Request access</a>
    </div>

    <div class="footer">
      <div class="footer-left">
        <span>Singapore</span>
        <span>XIXI Media Pte Ltd</span>
      </div>
      <div class="footer-right">
        <span>Volume I</span>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal" id="modalContent">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">Close</button>
      <h2 class="modal-title" id="modal-title">Request access</h2>
      <p class="modal-sub">Membership is by application. Each request is reviewed personally.</p>

      <form id="applicationForm"
            name="xixi-application"
            method="POST"
            data-netlify="true"
            netlify-honeypot="bot-field"
            onsubmit="handleSubmit(event)">

        <input type="hidden" name="form-name" value="xixi-application">
        <p style="display:none;"><label>Don't fill: <input name="bot-field"></label></p>

        <div class="form-group">
          <label class="form-label" for="name">Full name</label>
          <input type="text" id="name" name="name" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="profession">What you do</label>
          <input type="text" id="profession" name="profession" class="form-input" placeholder="Role, organisation, city" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="referral">Who referred you</label>
          <input type="text" id="referral" name="referral" class="form-input" placeholder="Optional">
        </div>

        <div class="form-group">
          <label class="form-label" for="reason">Why XIXI</label>
          <textarea id="reason" name="reason" class="form-textarea" rows="3" required></textarea>
        </div>

        <button type="submit" class="form-submit">Submit application</button>

        <p class="form-note">A response within five days.</p>
      </form>
    </div>
  </div>

  <script>
    function openModal(e) {
      if (e) e.preventDefault();
      document.getElementById('modal').classList.add('active');
      document.body.style.overflow = 'hidden';
      setTimeout(function(){ document.getElementById('name').focus(); }, 400);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      document.body.style.overflow = '';
    }

    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    function handleSubmit(e) {
      e.preventDefault();
      var form = e.target;
      var formData = new FormData(form);

      fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(formData).toString()
      }).then(function() { showSuccess(); }).catch(function() { showSuccess(); });
    }

    function showSuccess() {
      document.getElementById('modalContent').innerHTML =
        '<button class="modal-close" onclick="closeModal()" aria-label="Close">Close</button>' +
        '<div class="success-state">' +
        '<div class="success-ornament"></div>' +
        '<h2 class="modal-title">Thank you</h2>' +
        '<p class="modal-sub">Your application is received. Each request is reviewed personally. You will hear from us within five days.</p>' +
        '</div>';
    }
  </script>
</body>
</html>
